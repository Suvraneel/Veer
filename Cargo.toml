[workspace]
resolver = "2"
members = ["crates/radlet-core", "crates/radlet-cli"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
calamine = "0.37"
csv = "1.3"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "ico", "tga", "qoi", "webp", "avif", "rayon"] }
lopdf = { version = "0.45", default-features = false }
getrandom = "0.4"
kamadak-exif = "0.6"
quick-xml = "0.42"
resvg = "0.45"
qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.11", default-features = false }
rust_xlsxwriter = "0.101"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sha1 = "0.11"
md-5 = "0.11"
base64 = "0.22"
svg2pdf = "0.13"
visioncortex = "0.9.3"
tempfile = "3"
thiserror = "2"
toml = "0.8"
yaml-rust2 = { version = "0.13", default-features = false }
brotli = { version = "8", default-features = false, features = ["std"] }
rusqlite = { version = "0.37", features = ["bundled", "limits"] }
zune-jpegxl = "0.5"
zune-core = "0.5"
png = "0.18"
webp = { version = "0.3", default-features = false }
libwebp-sys = "0.9"
zip = { version = "9", default-features = false, features = ["deflate-flate2", "deflate64", "aes-crypto", "lzma", "xz", "zstd"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
