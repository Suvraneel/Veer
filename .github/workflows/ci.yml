name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    name: Engine (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install FFmpeg and bsdtar for media and archive tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libarchive-tools
      - name: Download PDFium for PDF-to-image tests
        run: |
          mkdir -p "$RUNNER_TEMP/pdfium"
          curl -fsSL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8111/pdfium-linux-x64.tgz" | tar xz -C "$RUNNER_TEMP/pdfium"
          echo "RADLET_PDFIUM=$RUNNER_TEMP/pdfium/lib/libpdfium.so" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  mac:
    name: Mac app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Swift is 6.2 or later
        # Older Swift leaves out the Apple Intelligence tools (FoundationModels).
        run: |
          swift --version
          swift --version 2>&1 | grep -Eq 'Swift version (6\.([2-9]|[1-9][0-9])|([7-9]|[1-9][0-9])\.)'
      - run: brew install ffmpeg
      - run: cargo test --all
      - run: cargo build --release -p radlet-cli
      - name: Record a live helper session
        timeout-minutes: 5
        run: mac/scripts/contract-session.sh target/release/radlet "$RUNNER_TEMP/contract"
      - name: Swift tests (RadletKit, plus the live protocol contract)
        timeout-minutes: 15
        run: RADLET_CONTRACT_DIR="$RUNNER_TEMP/contract" swift test --package-path mac
      - name: Build Radlet.app
        run: mac/scripts/build-app.sh
      - name: Smoke-test the bundled helpers
        run: |
          echo '{"id":1,"method":"hello"}' | dist/Radlet.app/Contents/Helpers/radlet serve | grep '"vision":true'
          dist/Radlet.app/Contents/Helpers/radlet-vision selftest
      - name: Convert sound and video without FFmpeg (AVFoundation)
        env:
          RADLET_NO_FFMPEG: "1"
        run: |
          work="$RUNNER_TEMP/native"
          mkdir -p "$work"
          python3 -c 'import math, struct, wave, sys
          w = wave.open(sys.argv[1], "wb"); w.setnchannels(1); w.setsampwidth(2); w.setframerate(44100)
          w.writeframes(b"".join(struct.pack("<h", int(8000 * math.sin(i * 2 * math.pi * 440 / 44100))) for i in range(44100)))
          w.close()' "$work/tone.wav"
          helper=dist/Radlet.app/Contents/Helpers/radlet
          "$helper" convert --to m4a "$work/tone.wav"
          "$helper" convert --to aiff "$work/tone.m4a"
          test -s "$work/tone.m4a" && test -s "$work/tone.aiff"
          file "$work/tone.m4a" "$work/tone.aiff"
      - run: ditto -c -k --keepParent dist/Radlet.app dist/Radlet.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Radlet-mac
          path: dist/Radlet.zip
